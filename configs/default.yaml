study:
  seeds: [0, 1, 2]
  output_dir: outputs

plant:
  cart_mass: 1.0
  nominal_pole_mass: 0.10
  pole_length: 0.50
  gravity: 9.81
  dt: 0.02
  force_limit: 20.0
  track_limit: 2.40

controller:
  energy_gain: 4.0
  cart_position_gain: 1.0
  cart_velocity_gain: 1.5
  switch_angle: 0.55
  residual_force_limit: 5.0
  lqr_q: [10.0, 2.0, 120.0, 8.0]
  lqr_r: 0.5

shield:
  active_angle: 0.45
  alpha: 0.20
  tolerance: 1.0e-9

training:
  pole_mass_range: [0.06, 0.14]
  episode_steps: 1000
  total_timesteps: 100000
  learning_rate: 3.0e-4
  buffer_size: 100000
  learning_starts: 2000
  batch_size: 256
  gamma: 0.99
  start_noise: [0.05, 0.05, 0.10, 0.10]

evaluation:
  pole_masses: [0.04, 0.06, 0.08, 0.10, 0.12, 0.14, 0.16]
  episodes_per_mass: 10
  episode_steps: 1000
  success_hold_steps: 100
  success_tolerance: [0.20, 0.50, 0.15, 0.75]
  fixed_point_tolerance: 1.0e-8
  jacobian_epsilon: 1.0e-5
  basin_angles: [-3.141592653589793, 3.141592653589793]
  basin_angular_rates: [-6.0, 6.0]
  basin_points_per_axis: 9
  basin_horizon_steps: 600
