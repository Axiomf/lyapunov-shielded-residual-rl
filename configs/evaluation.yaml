seeds: [11, 22, 33]

mass_sweep:
  values: [0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95,
           1.00, 1.05, 1.10, 1.15, 1.20, 1.25, 1.30, 1.35, 1.40]

basin_slice:
  grid_size: 61
  theta_range: [-3.14159, 3.14159]
  theta_dot_range: [-8.0, 8.0]
  x: 0.0
  x_dot: 0.0

basin_volume:
  samples: 1000
  x_range: [-2.0, 2.0]
  theta_range: [-3.14159, 3.14159]
  x_dot_range: [-2.0, 2.0]
  theta_dot_range: [-8.0, 8.0]

success:
  final_window_seconds: 2.0
  max_abs_theta: 0.15
  max_abs_theta_dot: 0.5
  max_abs_x: 0.5
  require_no_track_violation: true