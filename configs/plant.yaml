simulation:
  control_dt: 0.02
  integration_substeps: 4
  episode_seconds: 10.0

plant:
  cart_mass: 1.0
  pole_mass_nominal: 0.1
  pole_length: 0.5
  gravity: 9.81
  force_limit: 10.0
  track_limit: 2.4

uncertainty:
  parameter: pole_mass_ratio
  train_min: 0.8
  train_max: 1.2
  evaluation_min: 0.6
  evaluation_max: 1.4

conventions:
  state_order: [x, theta, x_dot, theta_dot]
  upright_angle: 0.0